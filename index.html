<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar — Study Hub per Mata Kuliah</title>
<style>
:root{
  --bg:#0b1220; --bg2:#111a2e; --card:#16213a; --card2:#1c2947;
  --ink:#e8eefc; --muted:#9fb0d0; --line:#26375c;
  --accent:#38bdf8; --accent2:#6366f1; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#1a2547 0,var(--bg) 55%);
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.88);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;padding:11px 0;gap:10px}
.brand{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:9px;white-space:nowrap;cursor:pointer}
.brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem;min-width:0}
.crumbs button{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;padding:3px 6px;border-radius:7px}
.crumbs button:hover{color:var(--ink);background:var(--card2)}
.crumbs .cur{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.5}

/* ---------- views ---------- */
.view{padding:30px 0;min-height:60vh}
.view[hidden]{display:none}
.htitle{font-size:1.9rem;letter-spacing:-.5px;margin-bottom:6px}
.hsub{color:var(--muted);margin-bottom:24px;max-width:720px}

/* course grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}
.ccard{position:relative;background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:17px;padding:20px;cursor:pointer;transition:.18s;overflow:hidden}
.ccard:hover{transform:translateY(-4px);border-color:var(--accent)}
.ccard .cnum{font-size:2.3rem;font-weight:900;color:var(--line);line-height:1}
.ccard h3{font-size:1.2rem;margin:10px 0 6px;letter-spacing:-.3px}
.ccard .ceb{color:var(--accent);font-weight:700;font-size:.74rem;letter-spacing:.8px;text-transform:uppercase}
.ccard p{color:var(--muted);font-size:.9rem;margin-top:8px}
.ccard .ctags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.tag.a{color:var(--accent);border-color:rgba(56,189,248,.35)}

/* pertemuan list */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:15px;padding:18px;cursor:pointer;transition:.18s;display:flex;gap:14px;align-items:flex-start}
.pcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.pcard .pnum{flex:0 0 44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#06122a;font-weight:800;display:grid;place-items:center;font-size:1.1rem}
.pcard h4{font-size:1.1rem;margin-bottom:4px}
.pcard .psub{color:var(--muted);font-size:.88rem}
.pcard .ptags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

/* content sections */
.course{padding:10px 0}
.cbanner{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.cnum{font-size:2.4rem;font-weight:900;color:var(--line);line-height:1}
.chdr h2{font-size:1.6rem;letter-spacing:-.4px;margin-bottom:4px}
.eyebrow{color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:1px;text-transform:uppercase}
.csummary{color:var(--muted);margin-top:8px;max-width:720px}
.ptitle{margin:18px 0 4px;font-size:1.25rem}

.subsec{margin:28px 0}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sec-h h3{font-size:1.25rem;letter-spacing:-.3px}
.sec-h .n{background:var(--card2);color:var(--accent);font-weight:800;font-size:.85rem;
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.sec-sub{color:var(--muted);margin-bottom:16px;max-width:720px;font-size:.94rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:15px;padding:17px;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card h4{font-size:1.02rem;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.card .lvl{font-size:.64rem;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:999px;
  background:rgba(56,189,248,.15);color:var(--accent)}
.card p{color:var(--muted);font-size:.9rem}
.card ul{margin:7px 0 0 16px;color:var(--muted);font-size:.88rem}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);font-weight:700}
td.f{font-weight:700;color:var(--accent)}
tr:last-child td{border-bottom:none}
.low{color:#86efac}.diff{color:#fca5a5}

.qbox{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.83rem;margin:4px 0 12px}
.pbar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-bottom:16px}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),#a5f3fc);width:0;transition:.3s}
.qtext{font-size:1.08rem;font-weight:600;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;background:var(--card2);border:2px solid var(--line);color:var(--ink);
  padding:11px 14px;border-radius:11px;cursor:pointer;font-size:.94rem;transition:.15s;display:flex;gap:11px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:0 0 23px;height:23px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.76rem}
.opt.correct{border-color:var(--ok);background:rgba(34,197,94,.13)}
.opt.correct .k{background:var(--ok);color:#05230f}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.13)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:13px;padding:12px 14px;border-radius:11px;font-size:.9rem;display:none;border-left:4px solid}
.fb.show{display:block}.fb.ok{background:rgba(34,197,94,.12);border-color:var(--ok)}
.fb.bad{background:rgba(239,68,68,.12);border-color:var(--bad)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06122a;border:none;
  padding:10px 19px;border-radius:11px;font-weight:700;cursor:pointer;margin-top:14px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.scorepill{background:var(--card2);padding:5px 13px;border-radius:999px;font-weight:700;font-size:.86rem}
.rescore{font-size:2.6rem;font-weight:800;text-align:center;color:var(--accent);margin:6px 0}
.review{margin-top:16px}
.rvi{padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card2)}
.rvi .rq{font-weight:600;margin-bottom:3px;font-size:.9rem}.rvi .ra{font-size:.84rem}
.ra.ok{color:var(--ok)}.ra.bad{color:var(--bad)}
.hidden{display:none}

.wcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:13px}
.wcard h4{font-size:1.05rem;margin-bottom:3px}
.wcard .concept{color:var(--accent);font-style:italic;font-size:.86rem;margin-bottom:10px}
.wcard .q{margin:8px 0}
.wcard .q .t{font-weight:700}.wcard .q .a{color:var(--muted);font-size:.9rem}

.backbtn{background:var(--card2);color:var(--ink);border:1px solid var(--line);
  padding:8px 15px;border-radius:10px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:600;margin-bottom:8px}
.backbtn:hover{border-color:var(--accent)}

footer{padding:30px 0;color:var(--muted);font-size:.82rem;text-align:center;border-top:1px solid var(--line)}
footer b{color:var(--ink)}
@media(max-width:600px){.cbanner h2,.htitle{font-size:1.4rem}.crumbs{font-size:.78rem}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topin">
    <div class="brand" onclick="goHome()"><span class="dot"></span>StudyHub</div>
    <div class="crumbs" id="crumbs"></div>
  </div>
</div>

<div class="wrap">
  <!-- HOME: daftar mata kuliah -->
  <div class="view" id="viewHome">
    <h1 class="htitle">📚 Study Hub</h1>
    <p class="hsub">Pilih mata kuliah, lalu pilih pertemuan. Materi, peta konsep, tabel, kuis, dan kartu wawancara tersedia per pertemuan.</p>
    <div class="cgrid" id="courseGrid"></div>
  </div>

  <!-- COURSE: pilihan pertemuan -->
  <div class="view" id="viewCourse" hidden>
    <button class="backbtn" onclick="goHome()">← Kembali ke daftar mata kuliah</button>
    <div id="courseHead"></div>
    <h3 style="margin:22px 0 12px;font-size:1.1rem">Pilih pertemuan</h3>
    <div class="plist" id="ptmList"></div>
  </div>

  <!-- PERTEMUAN: konten -->
  <div class="view" id="viewPtm" hidden>
    <button class="backbtn" onclick="goCourse(cur.course)">← Kembali ke pertemuan</button>
    <div id="ptmMount"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <p id="footSrc"></p>
    <p style="margin-top:8px">Study Hub · aplikasi belajar per mata kuliah · otomatis dari PPT/slide</p>
  </div>
</footer>

<script>
/* ============================================================
   COURSES — struktur per pertemuan
   {id, title, eyebrow, summary, pertemuan:[
       {label, sub, cards[], blocks[], table{}, quiz[], wawancara[]} ]}
   TAMBAH MATA KULIAH = append objek di COURSES.
   TAMBAH PERTEMUAN  = append objek di pertemuan[].
   ============================================================ */
const COURSES=[
{
  id:"tdo",
  title:"TDO — Organizational Design & Strategy",
  eyebrow:"Week 8 · Organizational Theory & Change Management",
  summary:"Organisasi strategi adalah rencana tindakan untuk menciptakan nilai. Manajer mengelola hubungan strategy, structure, dan culture pada setiap level.",
  pertemuan:[
  {
    label:"Pertemuan 1", sub:"Konsep & Level Strategi",
    cards:[
      {icon:"🧩",h:"Strategy",lvl:"KONSEP",p:"Plan of action untuk menciptakan nilai. Diformulasikan pada empat level oleh manajer di setiap level."},
      {icon:"🔋",h:"Core Competences",lvl:"SUMBER",p:"Berasal dari Specialized Resources (Functional & Organizational Resources) dan Coordination Abilities."},
      {icon:"🔗",h:"Value-Creation Cycle",lvl:"PROSES",p:"Dibangun dari kompetensi inti: diciptakan di fungsional, digabung di bisnis, dilindungi di korporasi, dieksploitasi lewat global."},
      {icon:"🌐",h:"Global Expansion",lvl:"EKSPANSI",p:"Empat cara menciptakan nilai bagi pemangku kepentingan melalui ekspansi global."}
    ],
    blocks:[
      {icon:"🏢",h:"Empat Level Strategi",lvl:"STRUKTUR",items:[
        "1 · Functional — rendahkan biaya / diferensiasi di tiap fungsi",
        "2 · Business — Low-cost · Differentiation · Focus",
        "3 · Corporate — Vertical integration · Related & Unrelated diversification",
        "4 · Global — Multidomestic · International · Global · Transnational"]},
      {icon:"💡",h:"Culture = Keunggulan Berkelanjutan",lvl:"INSIGHT",items:[
        "Pesaing mudah meniru struktur, sangat sulit meniru budaya.",
        "Budaya yang efektif = sumber keunggulan kompetitif yang tahan lama."]},
      {icon:"🌍",h:"4 Cara Global Menciptakan Nilai",lvl:"GLOBAL",items:[
        "Transferring core competences abroad",
        "Establishing a global network",
        "Gaining access to global resources & skills",
        "Using global learning to enhance core competences"]},
      {icon:"⚙️",h:"Tiga Faktor Penentu Struktur",lvl:"BUSINESS",items:[
        "Produk lebih beragam → kontrol lebih besar",
        "Kelompok pelanggan baru → struktur yang melayani",
        "Pesatnya produk baru → koordinasi antarfungsi"]}
    ],
    quiz:[
      {c:"Definisi",q:"Menurut materi, apa definisi organizational strategy?",o:["Rencana tindakan yang dilakukan organisasi untuk menciptakan nilai","Daftar struktur organisasi dan jabatan karyawan","Anggaran tahunan perusahaan untuk operasional","Prosedur tetap yang tidak berubah"],a:0,x:"Organizational strategy = <b>rencana tindakan</b> untuk menciptakan nilai. Manajer mengelola hubungan strategy, structure, culture."},
      {c:"4 Level",q:"Yang <b>bukan</b> termasuk empat level strategi adalah…",o:["Functional-level strategy","Business-level strategy","Marketing-level strategy","Global expansion strategy"],a:2,x:"Empat level: <b>Functional, Business, Corporate, Global expansion</b>. Marketing termasuk dalam fungsi, bukan level."},
      {c:"Culture",q:"Mengapa budaya organisasi menjadi sumber keunggulan kompetitif penting?",o:["Karena mudah ditiru pesaing","Karena struktur meniru budaya lebih mudah","Pesaing mudah meniru struktur, tetapi sangat sulit meniru budaya","Karena budaya tidak berpengaruh pada strategi"],a:2,x:"Struktur mudah ditiru, <b>budaya sangat sulit</b>. Budaya efektif = keunggulan kompetitif berkelanjutan."},
      {c:"Business",q:"Strategi yang mengkhususkan diri pada satu segmen pasar disebut…",o:["Low-cost strategy","Differentiation strategy","Focus strategy","Diversification strategy"],a:2,x:"<b>Focus strategy</b> = memusatkan seluruh sumber daya pada satu segmen pasar."},
      {c:"Business",q:"Low-cost business-level strategy berarti organisasi…",o:["Memproduksi barang berkualitas tinggi berharga tinggi","Memproduksi barang/jasa dengan harga rendah","Fokus pada satu segmen tertentu","Mendiversifikasi ke domain baru"],a:1,x:"<b>Low-cost</b> = barang/jasa harga rendah. <b>Diferensiasi</b> = kualitas tinggi, harga tinggi untuk segmen tertentu."},
      {c:"Business",q:"Tiga faktor yang memengaruhi pilihan struktur organisasi adalah…",o:["Jumlah karyawan, laba, utang","Produk lebih beragam, pelanggan baru, pesatnya produk baru","Lokasi kantor, jumlah cabang, mata uang","Ukuran gudang, jumlah pemasok, volume"],a:1,x:"(1) produk lebih beragam, (2) kelompok pelanggan baru, (3) pesatnya pengembangan produk baru."},
      {c:"Corporate",q:"Tiga jenis utama corporate-level strategy adalah…",o:["Multidomestic, International, Global","Vertical integration, Related & Unrelated diversification","Low-cost, Differentiation, Focus","Functional, Business, Corporate"],a:1,x:"Corporate: <b>vertical integration, related diversification, unrelated diversification</b>."},
      {c:"Corporate",q:"Tujuan corporate-level strategy adalah…",o:["Menurunkan biaya operasional harian saja","Menggunakan & mengembangkan kompetensi low-cost/diferensiasi untuk melindungi & memperluas domain","Hanya fokus pada satu segmen","Menghapus seluruh fungsi manufaktur"],a:1,x:"Tujuannya: gunakan & kembangkan kompetensi low-cost/diferensiasi untuk <b>melindungi & memperbesar domain</b>, berekspansi ke domain baru."},
      {c:"Global",q:"Yang <b>bukan</b> empat cara global expansion menciptakan nilai adalah…",o:["Transferring core competences abroad","Establishing a global network","Mengurangi karyawan secara massal","Using global learning to enhance core competences"],a:2,x:"Empat cara: transfer kompetensi inti, jaringan global, akses sumber daya global, pembelajaran global. Mengurangi karyawan bukan bagian."},
      {c:"Global",q:"Empat strategi implementasi lintas negara adalah…",o:["Multidomestic, International, Global, Transnational","Low-cost, Differentiation, Focus, Diversification","Functional, Business, Corporate, Global","Vertical, Horizontal, Conglomerate, Merger"],a:0,x:"Empat strategi: <b>Multidomestic, International, Global, Transnational</b>."},
      {c:"Core Competence",q:"Sumber core competences mencakup…",o:["Hanya laba tahunan","Specialized resources & coordination abilities","Jumlah cabang & aset tetap","Struktur & jabatan direksi"],a:1,x:"Sumber: <b>Specialized Resources</b> (Functional & Organizational) dan <b>Coordination Abilities</b>."}
    ],
    wawancara:[
      {t:"Budaya Sulit Ditiru",c:"Culture as Competitive Advantage",q:[
        ["Konsep apa yang paling relevan?","Pentingnya culture: pesaing mudah meniru struktur, sangat sulit meniru budaya."],
        ["Mengapa budaya jadi keunggulan kompetitif?","Budaya efektif sulit ditiru — terbentuk dari nilai & koordinasi jangka panjang."],
        ["Jika B 'membeli' konsultan untuk meniru budaya A, otomatis tercipta?","Tidak. Budaya tumbuh dari praktik & sejarah, bukan prosedur yang bisa disalin."]]},
      {t:"Dua Strategi Harga",c:"Business-Level (Low-Cost vs Focus)",q:[
        ["Konsep apa yang membedakan keduanya?","X = low-cost business-level (murah, pasar luas); Y = focus (satu segmen, seluruh sumber daya)."],
        ["Apa tujuan business-level strategy?","Menggabungkan kompetensi low-cost & diferensiasi fungsional untuk mengeksploitasi peluang; memilih domain nilai."],
        ["Jika Y meniru X (jual ke seluruh pasar), risiko apa?","Kehilangan fokus/keunggulan niche; sumber daya terencerkan; bersaing langsung dengan low-cost besar."]]},
      {t:"Kendaraan Mewah",c:"Differentiation Business-Level",q:[
        ["Konsep apa yang relevan?","Differentiation business-level strategy: barang berkualitas tinggi, harga premium, segmen tertentu."],
        ["Apa yang harus konsisten dengannya?","Fungsi pendukung (HRM, R&D, marketing) selaras menciptakan kualitas/prestise."],
        ["Jika harga dipangkas drastis untuk volume, risiko?","Citra premium rusak, terjebak 'di tengah' — tak unggul sebagai diferensiator maupun low-cost."]]},
      {t:"Portofolio Melebar",c:"Structure Follows Strategy",q:[
        ["Faktor apa memengaruhi pilihan struktur?","Produk lebih beragam → butuh kontrol lebih besar atas pengembangan, pemasaran, produksi."],
        ["Sebutkan tiga faktor penentu struktur.","Produk beragam, kelompok pelanggan baru, pesatnya pengembangan produk baru."],
        ["Jika produk baru makin pesat, arah penyesuaian struktur?","Meningkatkan koordinasi antarfungsi agar pengembangan cepat & terintegrasi."]]},
      {t:"Beli Pemasok",c:"Corporate-Level (Vertical Integration)",q:[
        ["Konsep apa yang relevan?","Vertical integration — bergerak ke hulu (memiliki pemasok) untuk kendalikan pasokan & nilai."],
        ["Apa tujuan corporate-level strategy?","Gunakan & kembangkan kompetensi untuk melindungi & memperbesar domain, berekspansi ke domain baru."],
        ["Jika integrasi menambah biaya koordinasi > manfaat, evaluasi apa?","Bandingkan manfaat kontrol vs biaya koordinasi internal; jika lebih besar, mungkin kembali membeli."]]},
      {t:"Dua Diversifikasi",c:"Related vs Unrelated Diversification",q:[
        ["Konsep apa yang membedakan?","Related (bidang berkaitan, ada sinergi) vs Unrelated (bidang tak berkaitan)."],
        ["Struktur apa yang menyertai unrelated diversification?","Conglomerate structure — unit-unit otonom di bawah holding."],
        ["Mengapa related diversification punya sinergi lebih jelas?","Berbagi kompetensi inti/sumber daya/jaringan; unrelated lebih bergantung pada alokasi modal."]]},
      {t:"Kompetensi ke Luar Negeri",c:"Global Expansion: Transferring Competences",q:[
        ["Konsep apa yang relevan?","Transferring core competences abroad — memindahkan kompetensi inti ke luar negeri untuk nilai baru."],
        ["Sebutkan empat cara global expansion menciptakan nilai.","Transfer kompetensi inti, jaringan global, akses sumber daya global, pembelajaran global."],
        ["Jika kompetensi tak bisa ditransfer (terikat budaya lokal), alternatif?","Manfaatkan akses sumber daya global atau pembelajaran global dari pasar baru."]]},
      {t:"Empat Pintu Masuk",c:"Global Implementation Strategies",q:[
        ["Konsep apa yang relevan?","Empat strategi: Multidomestic, International, Global, Transnational."],
        ["Apa ide dasar multidomestic?","Menyesuaikan produk/strategi tiap pasar secara otonom (responsif lokal)."],
        ["Untuk efisien global sekaligus responsif lokal, strategi mana?","Transnational — menggabungkan efisiensi global & responsivitas lokal."]]},
      {t:"Dari Mana Keunggulan",c:"Sources of Core Competences",q:[
        ["Konsep apa yang relevan?","Sumber core competences: Specialized Resources (Functional & Organizational) + Coordination Abilities."],
        ["Hubungannya dengan level strategi?","Kompetensi fungsional → keunggulan bisnis → dilindungi korporasi → dieksploitasi global."],
        ["Jika sumber daya fisik sama, mengapa kompetensi bisa berbeda?","Karena core competences juga dari cara sumber daya dikoordinasikan, bukan hanya fisik."]]},
      {t:"Menjaga Keselarasan",c:"Linking Strategy, Structure & Culture",q:[

/* ============================================================ RENDER */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let cur={course:null,ptm:null};

function showView(id){
  ['viewHome','viewCourse','viewPtm'].forEach(v=>{$(v).hidden=(v!==id);});
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderCrumbs(parts){
  const c=$('crumbs');
  c.innerHTML='<button onclick="goHome()">🏠 Beranda</button>'+parts.map((p,i)=>
    `<span class="sep">›</span><button onclick="${p.fn}">${esc(p.label)}</button>`).join('')
    +(parts.length?`<span class="sep">›</span><span class="cur">${esc(parts[parts.length-1].active||'')}</span>`:'');
}

function goHome(){
  cur={course:null,ptm:null};
  renderCrumbs([]);
  const total=COURSES.reduce((n,c)=>n+c.pertemuan.length,0);
  $('courseGrid').innerHTML=COURSES.map((c,i)=>{
    const q=c.pertemuan.reduce((n,p)=>n+(p.quiz?p.quiz.length:0),0);
    const w=c.pertemuan.reduce((n,p)=>n+(p.wawancara?p.wawancara.length:0),0);
    return `<div class="ccard" onclick="goCourse(${i})">
      <div class="cnum">${String(i+1).padStart(2,'0')}</div>
      <div class="ceb">${esc(c.eyebrow)}</div>
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.summary)}</p>
      <div class="ctags">
        <span class="tag a">${c.pertemuan.length} pertemuan</span>
        <span class="tag">📝 ${q} kuis</span>
        <span class="tag">💬 ${w} kartu</span>
      </div></div>`;
  }).join('');
  $('footSrc').innerHTML=COURSES.length>1
    ? `<b>Mata kuliah:</b> ${COURSES.map(c=>esc(c.title)).join(' · ')}`
    : `<b>Sumber:</b> ${esc(COURSES[0].eyebrow)}`;
  showView('viewHome');
}

function goCourse(i){
  cur.course=i;cur.ptm=null;
  const c=COURSES[i];
  renderCrumbs([{label:c.title,fn:`goCourse(${i})`}]);
  $('courseHead').innerHTML=`<div class="cbanner"><div class="cnum">${String(i+1).padStart(2,'0')}</div>
    <div class="chdr"><div class="eyebrow">${esc(c.eyebrow)}</div><h2>${esc(c.title)}</h2>
    <p class="csummary">${esc(c.summary)}</p></div></div>`;
  $('ptmList').innerHTML=c.pertemuan.map((p,j)=>{
    const q=p.quiz?p.quiz.length:0, w=p.wawancara?p.wawancara.length:0, k=p.cards?p.cards.length:0;
    return `<div class="pcard" onclick="goPtm(${i},${j})">
      <div class="pnum">${String(j+1).padStart(2,'0')}</div>
      <div><h4>${esc(p.label)}</h4><div class="psub">${esc(p.sub)}</div>
      <div class="ptags">
        <span class="tag a">${k} kartu</span>
        <span class="tag">📝 ${q} kuis</span>
        <span class="tag">💬 ${w} kartu wawancara</span>
      </div></div></div>`;
  }).join('');
  showView('viewCourse');
}

      ${t.rows.map(r=>`<tr><td class="f">${esc(r[0])}</td><td class="low">${esc(r[1])}</td><td class="diff">${esc(r[2])}</td></tr>`).join('')}
      </tbody></table></div></div>`;

      <div class="qbox" id="${qid}">
        <div class="startq"><p style="color:var(--muted);margin-bottom:14px">Siap menguji pemahamanmu?</p>
          <button class="btn" data-start="${qid}">🚀 Mulai Kuis</button></div>
        <div class="playq hidden">
          <div class="qmeta"><span class="qbadge">Soal 1</span><span class="scorepill">⭐ <span class="scoreLive">0</span></span></div>

          <div class="qmeta"><span class="qProg"></span><span class="qCat"></span></div>
          <div class="qtext qText"></div><div class="opts"></div>
          <div class="fb"></div><button class="btn nextq" style="display:none"></button>

        <div class="endq hidden" style="text-align:center">
          <div class="rescore finalScore">0/0</div><p class="endMsg" style="color:var(--muted)"></p>

        <div class="wcard"><h4>[${String(wi+1).padStart(2,'0')}] ${esc(w.t)}</h4>
        <div class="concept">${esc(w.c)}</div>
        ${w.q.map(([t,a])=>`<div class="q"><div class="t">Q · ${esc(t)}</div><div class="a">${esc(a)}</div></div>`).join('')}

/* ============================================================ QUIZ ENGINE */
function initQuiz(boxId,quiz){
  const box=$(boxId);
  if(!box)return;
  const start=box.querySelector('.startq'),play=box.querySelector('.playq'),end=box.querySelector('.endq');
  let qi=0,score=0,answered=false,order=[];
  const KEYS=['A','B','C','D','E'];
  const q=el=>box.querySelector(el);
  start.querySelector('[data-start]').onclick=()=>{
    order=quiz.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    qi=0;score=0;answered=false;start.classList.add('hidden');end.classList.add('hidden');play.classList.remove('hidden');show();
  };
  function show(){
    answered=false;const it=quiz[order[qi]];
    q('.qbadge').textContent='Soal '+(qi+1);
    q('.qProg').textContent=(qi+1)+' / '+quiz.length;
    q('.qCat').textContent=it.c;q('.qText').textContent=it.q;
    q('.prog').style.width=(qi/quiz.length*100)+'%';q('.scoreLive').textContent=score;
    q('.fb').className='fb';q('.nextq').style.display='none';
    q('.opts').innerHTML=it.o.map((op,i)=>`<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${esc(op)}</span></button>`).join('');
    q('.opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));
  }
  function pick(i,el){
    if(answered)return;answered=true;const it=quiz[order[qi]];
    q('.opts').querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;
      if(j===it.a)b.classList.add('correct');
      if(j===i&&i!==it.a)b.classList.add('wrong');});
    const fb=q('.fb');
    if(i===it.a){score++;q('.scoreLive').textContent=score;fb.className='fb ok show';fb.innerHTML='✅ <b>Benar!</b> '+it.x;}
    else{fb.className='fb bad show';fb.innerHTML='❌ <b>Kurang tepat.</b> '+it.x;}
    const nb=q('.nextq');nb.style.display='inline-block';
    nb.textContent=(qi===quiz.length-1)?'Lihat Hasil 🏆':'Soal Berikutnya →';
    nb.onclick=()=>{qi<quiz.length-1?(qi++,show()):finish();};
  }
  function finish(){
    play.classList.add('hidden');end.classList.remove('hidden');
    const pct=Math.round(score/quiz.length*100);
    q('.finalScore').textContent=score+'/'+quiz.length;
    q('.endMsg').textContent=(pct>=85?'🌟 Luar biasa!':pct>=70?'👍 Bagus!':pct>=50?'📚 Cukup.':'💪 Semangat!')+' ('+pct+'%)';
    q('.review').innerHTML=quiz.map((it,i)=>`<div class="rvi"><div class="rq">${i+1}. ${esc(it.q)}</div><div class="ra ok">✔ ${esc(it.o[it.a])}</div></div>`).join('');
    q('.toggleRev').onclick=()=>q('.review').classList.toggle('hidden');
    q('.restart').onclick=()=>{end.classList.add('hidden');play.classList.add('hidden');start.classList.remove('hidden');};
  }
}

goHome();
</script>
