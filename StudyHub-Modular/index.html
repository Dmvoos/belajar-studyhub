<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub — Belajar per Mata Kuliah</title>
<link rel="stylesheet" href="StudyHub-Modular/style.css">
</head>
<body>
<div id="studyhub-app"></div>
<script>
(async function(){
  const root=document.getElementById('studyhub-app');
  try {
    const response=await fetch('StudyHub-Modular/index.html',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const doc=new DOMParser().parseFromString(await response.text(),'text/html');
    root.innerHTML=doc.body.innerHTML;
    for(const item of Array.from(doc.querySelectorAll('script[src]'))){
      const script=document.createElement('script');
      script.src='StudyHub-Modular/'+item.getAttribute('src').replace(/^\.\//,'');
      script.async=false;
      document.body.appendChild(script);
      await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error('Gagal memuat '+script.src));});
    }
  } catch(error) {
    root.innerHTML='<main style="font-family:system-ui;padding:2rem"><h1>StudyHub gagal dimuat</h1><p>'+String(error.message)+'</p></main>';
    console.error(error);
  }
})();
</script>
</body>
</html>
